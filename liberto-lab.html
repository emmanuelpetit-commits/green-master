<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Liberto lab</title>
<style>html,body{margin:0;background:#F7FBFB;overflow:hidden}canvas{display:block}
.lbl{position:absolute;font:700 15px 'Spline Sans',Arimo,Arial,sans-serif;color:#242121;background:rgba(255,255,255,.8);padding:3px 8px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/addons/"}}
</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import MODELS_B64 from './assets/models-bundle.js';
const q=new URLSearchParams(location.search);
const VARIANT=q.get('v')||'A';            // A : visage officiel (yeux ovales + grand sourire) · B : visage « zen » (yeux fermés)
const VIEWS=(q.get('views')||'bike,front,side,back').split(',');
const LIB={yellow:0xF5B72B,white:0xFBFBF7,line:0x242121};
function toonGradientTex(){const d=new Uint8Array([88,88,88,255,160,160,160,255,255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;}
const toonGrad=toonGradientTex();
const toonMat=(color,map)=>new THREE.MeshToonMaterial({color:map?0xffffff:color,map:map||null,gradientMap:toonGrad});
const lineMat=new THREE.MeshBasicMaterial({color:LIB.line,side:THREE.BackSide});
function outlined(geo,color,thick,map){
  const g=new THREE.Group();const m=new THREE.Mesh(geo,toonMat(color,map));g.add(m);
  const og=geo.clone();if(!og.attributes.normal)og.computeVertexNormals();const p=og.attributes.position,n=og.attributes.normal;
  for(let i=0;i<p.count;i++)p.setXYZ(i,p.getX(i)+n.getX(i)*thick,p.getY(i)+n.getY(i)*thick,p.getZ(i)+n.getZ(i)*thick);
  g.add(new THREE.Mesh(og,lineMat));g.userData.mesh=m;return g;
}
/* ---------- corps-casque ---------- */
const H=1.0,Rm=0.5,YC=0.50,AT=0.50,AB=0.64,NT=2.4,NB=2.8,Y0=0.06;   // casque : super-ellipse, dôme rond en haut, base large et plate
function rAt(y){const d=y-YC;const a=d>=0?AT:AB,n=d>=0?NT:NB;const q=Math.min(1,Math.pow(Math.abs(d)/a,n));return Rm*Math.pow(1-q,1/n);}
function bodyProfile(){const pts=[new THREE.Vector2(0.001,0.0),new THREE.Vector2(rAt(Y0)*0.93,0.0),new THREE.Vector2(rAt(Y0),Y0)];const N=80;for(let i=1;i<=N;i++){const y=Y0+(H-Y0)*i/N;let r=rAt(y);if(i===N)r=0;pts.push(new THREE.Vector2(Math.max(0.001,r),y));}return pts;}
/* texture du casque : fond jaune, bande blanche avant→sommet→arrière, visière blanche cernée de noir + visage */
function helmetTexture(variant){
  const W=2048,Hh=1024;const c=document.createElement('canvas');c.width=W;c.height=Hh;const g=c.getContext('2d');
  g.fillStyle='#F5B72B';g.fillRect(0,0,W,Hh);
  const prof=bodyProfile();const vOfY=y=>{for(let i=1;i<prof.length;i++){if(prof[i].y>=y){const a=prof[i-1],b=prof[i];const f=b.y===a.y?0:(y-a.y)/(b.y-a.y);return (i-1+f)/(prof.length-1);}}return 1;};
  const yOf=v=>Hh-v*Hh;                                   // v (0 bas → 1 haut) → pixel y
  const pxPerWorldAt=y=>W/(2*Math.PI*Math.max(0.03,rAt(y)));   // px par mètre à la hauteur y
  // bande : largeur monde constante 0.17, méridien avant (u=.5) de y=0.70 au sommet, méridien arrière (u=0/1) du sommet à y=0.22
  const bandW=0.17;
  const band=(uc,y0,y1)=>{g.fillStyle='#FBFBF7';g.beginPath();const L=[],R=[];for(let i=0;i<=40;i++){const y=y0+(y1-y0)*i/40;const hw=Math.min(W*0.5,bandW*0.5*pxPerWorldAt(y));L.push([uc*W-hw,yOf(vOfY(y))]);R.push([uc*W+hw,yOf(vOfY(y))]);}
    g.moveTo(L[0][0],L[0][1]);for(const p of L)g.lineTo(p[0],p[1]);for(let i=R.length-1;i>=0;i--)g.lineTo(R[i][0],R[i][1]);g.closePath();g.fill();
    g.lineWidth=14;g.strokeStyle='#242121';g.lineJoin='round';g.beginPath();g.moveTo(L[0][0],L[0][1]);for(const p of L)g.lineTo(p[0],p[1]);g.stroke();g.beginPath();g.moveTo(R[0][0],R[0][1]);for(const p of R)g.lineTo(p[0],p[1]);g.stroke();};
  band(0.5,0.74,0.992);band(0,0.20,0.992);band(1,0.20,0.992);
  g.fillStyle='#FBFBF7';g.fillRect(0,0,W,yOf(vOfY(0.992)));                          // calotte : la bande se rejoint au pôle
  // visière : zone blanche avant (u autour de .5), de y=0.30 à y=0.72, coins arrondis, contour noir épais
  const uc=0.5*W;const halfAng=1.25;                                             // ±72° de part et d'autre de l'avant
  const faceTop=0.74,faceBot=0.20;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  const fx=uc-halfAng/(2*Math.PI)*W,fw=halfAng/Math.PI*W,fy=yOf(vOfY(faceTop)),fh=yOf(vOfY(faceBot))-fy;
  rr(fx,fy,fw,fh,150);g.fillStyle='#FBFBF7';g.fill();g.lineWidth=16;g.strokeStyle='#242121';g.stroke();
  // visage
  g.fillStyle='#242121';g.strokeStyle='#242121';g.lineCap='round';
  const ey=fy+fh*0.42;
  if(variant==='B'){ // yeux fermés, sourire tranquille
    g.lineWidth=18;for(const x of [uc-170,uc+170]){g.beginPath();g.arc(x,ey+30,85,Math.PI*1.15,Math.PI*1.85);g.stroke();}
    g.lineWidth=18;g.beginPath();g.moveTo(uc-150,fy+fh*0.68);g.quadraticCurveTo(uc,fy+fh*0.95,uc+150,fy+fh*0.68);g.stroke();
  }else{ // officiel : deux ovales noirs, sourcils, grand sourire avec dents
    for(const x of [uc-150,uc+150]){g.beginPath();g.ellipse(x,ey,60,105,0,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.ellipse(x-18,ey-46,18,26,0,0,Math.PI*2);g.fill();g.fillStyle='#242121';
      g.lineWidth=14;g.beginPath();g.moveTo(x-60,ey-140);g.quadraticCurveTo(x,ey-166,x+60,ey-140);g.stroke();}
    const my=fy+fh*0.64;g.beginPath();g.moveTo(uc-250,my);g.quadraticCurveTo(uc,my+210,uc+250,my);g.quadraticCurveTo(uc,my+50,uc-250,my);g.closePath();g.fill();
    g.fillStyle='#fff';g.beginPath();g.moveTo(uc-190,my+26);g.quadraticCurveTo(uc,my+90,uc+190,my+26);g.lineTo(uc+190,my+10);g.lineTo(uc-190,my+10);g.closePath();g.fill();
    g.strokeStyle='#242121';g.lineWidth=9;for(const dx of [-95,0,95]){g.beginPath();g.moveTo(uc+dx,my+10);g.lineTo(uc+dx,my+66);g.stroke();}
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function limb(points,radius){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return outlined(new THREE.TubeGeometry(curve,24,radius,12,false),LIB.yellow,0.012);}
function glove(){const g=new THREE.Group();g.add(outlined(new THREE.SphereGeometry(0.1,20,14),LIB.white,0.012));
  for(let i=0;i<4;i++){const f=outlined(new THREE.CapsuleGeometry(0.036,0.085,4,10),LIB.white,0.011);const a=(i-1.5)*0.45;f.position.set(Math.sin(a)*0.1,-0.01,-0.1-Math.cos(a)*0.06);f.rotation.set(1.3,a,0);g.add(f);}
  const th=outlined(new THREE.CapsuleGeometry(0.034,0.07,4,10),LIB.white,0.011);th.position.set(0.1,0.02,-0.03);th.rotation.set(0.4,0,-1.2);g.add(th);return g;}
function boot(){const g=new THREE.Group();const s=outlined(new THREE.SphereGeometry(0.13,22,16),LIB.white,0.012);s.scale.set(1.0,0.7,1.5);g.add(s);
  const cuff=outlined(new THREE.TorusGeometry(0.085,0.04,10,24),LIB.white,0.011);cuff.rotation.x=Math.PI/2;cuff.position.set(0,0.1,0.06);g.add(cuff);return g;}
function makeLiberto(variant){
  const root=new THREE.Group();
  const body=outlined(new THREE.LatheGeometry(bodyProfile(),96),LIB.yellow,0.02,helmetTexture(variant));root.add(body);
  // boutons de visière (pivot) de chaque côté, au bord arrière de la visière
  for(const s of [-1,1]){const k=outlined(new THREE.SphereGeometry(0.095,18,14),LIB.white,0.012);k.position.set(s*0.47,0.50,-0.16);k.scale.set(0.6,1,1);root.add(k);}
  // bras vers le guidon
  const armR=limb([[0.42,0.40,-0.1],[0.56,0.40,-0.42],[0.40,0.26,-0.66]],0.045);root.add(armR);
  const armL=limb([[-0.42,0.40,-0.1],[-0.56,0.40,-0.42],[-0.40,0.26,-0.66]],0.045);root.add(armL);
  const armLWave=limb([[-0.42,0.42,-0.08],[-0.76,0.80,-0.18],[-0.82,1.30,-0.08]],0.045);armLWave.visible=false;root.add(armLWave);
  const handR=glove();handR.position.set(0.40,0.25,-0.70);handR.rotation.set(1.15,0,0.25);root.add(handR);
  const handL=glove();handL.position.set(-0.40,0.25,-0.70);handL.rotation.set(1.15,0,-0.25);root.add(handL);
  const handLWave=glove();handLWave.position.set(-0.84,1.42,-0.08);handLWave.rotation.set(-0.3,0,-0.6);handLWave.visible=false;root.add(handLWave);
  // jambes vers les repose-pieds
  const legR=limb([[0.24,0.10,0.12],[0.32,-0.12,-0.02],[0.30,-0.32,-0.24]],0.045);root.add(legR);
  const legL=limb([[-0.24,0.10,0.12],[-0.32,-0.12,-0.02],[-0.30,-0.32,-0.24]],0.045);root.add(legL);
  const bootR=boot();bootR.position.set(0.32,-0.42,-0.30);bootR.rotation.y=0.12;root.add(bootR);
  const bootL=boot();bootL.position.set(-0.32,-0.42,-0.30);bootL.rotation.y=-0.12;root.add(bootL);
  root.userData={liberto:true,armL,armLWave,handL,handLWave};return root;
}
/* ---------- scène ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.NoToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xBFE6FF);
const hemi=new THREE.HemisphereLight(0xdff1ff,0x6fa85a,parseFloat(q.get('hemi')||'0.55'));scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff4dc,parseFloat(q.get('sun')||'1.15'));window.renderer=renderer;sun.position.set(2,4,-3);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.MeshToonMaterial({color:0x5DB64F,gradientMap:toonGrad}));ground.rotation.x=-Math.PI/2;ground.position.y=-1.0;scene.add(ground);
const lib=makeLiberto(VARIANT);scene.add(lib);
if(q.get('wave')){lib.userData.armL.visible=false;lib.userData.handL.visible=false;lib.userData.armLWave.visible=true;lib.userData.handLWave.visible=true;}
let bikeRoot=null;
function hueOf(hex){const c=new THREE.Color(hex);const h={};c.getHSL(h);return h.h*360;}
async function loadBike(){
  const loader=new GLTFLoader();const b=atob(MODELS_B64.motorcycle);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const res=await new Promise((ok,err)=>loader.parse(u.buffer,'assets/models/',ok,err));const bike=res.scene;let base=null;bike.traverse(o=>{if(o.isMesh&&o.material.map&&!base)base=o.material.map;});
  const deg=hueOf('#F5A623');const c=document.createElement('canvas');c.width=base.image.width;c.height=base.image.height;const g=c.getContext('2d');g.filter='hue-rotate('+deg.toFixed(0)+'deg) saturate(1.15) brightness(1.12)';g.drawImage(base.image,0,0);
  const map=new THREE.CanvasTexture(c);map.flipY=base.flipY;map.colorSpace=THREE.SRGBColorSpace;
  bike.traverse(o=>{if(o.isMesh){if(!o.geometry.attributes.normal)o.geometry.computeVertexNormals();o.material=new THREE.MeshToonMaterial({map,gradientMap:toonGrad,side:THREE.DoubleSide});o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,28),new THREE.LineBasicMaterial({color:0x242121})));}});
  bike.scale.setScalar(2.15/127.5);bikeRoot=new THREE.Group();bikeRoot.add(bike);scene.add(bikeRoot);bikeRoot.visible=false;
}
const cam=new THREE.PerspectiveCamera(32,1,0.1,50);
const LS=parseFloat(q.get('scale')||'1.22');
function setup(view){
  const onBike=view==='bike';bikeRoot&&(bikeRoot.visible=onBike);
  if(onBike){lib.scale.setScalar(LS);lib.position.set(0,0.74,0.26);lib.rotation.set(0.1,0,0);ground.position.y=0;}
  else{lib.scale.setScalar(1);lib.position.set(0,0.45,0);lib.rotation.set(0,0,0);ground.position.y=-0.6;}
  const t=onBike?new THREE.Vector3(0,1.0,0):new THREE.Vector3(0,0.85,0);const d=onBike?5.2:3.6;
  const ang={bike:-0.75,front:-0.55,side:-Math.PI/2,back:Math.PI-0.1,face:0}[view]??-0.55;
  cam.position.set(Math.sin(ang)*d,t.y+(onBike?1.3:0.8),-Math.cos(ang)*d);cam.lookAt(t);sun.position.copy(cam.position).add(new THREE.Vector3(2,4,0));
}
function frame(){
  const n=VIEWS.length,cols=n>2?2:n,rows=Math.ceil(n/cols);const W=innerWidth,Hh=innerHeight;const cw=W/cols,ch=Hh/rows;
  renderer.setScissorTest(true);
  VIEWS.forEach((v,i)=>{const x=(i%cols)*cw,y=Hh-ch*(Math.floor(i/cols)+1);renderer.setViewport(x,y,cw,ch);renderer.setScissor(x,y,cw,ch);cam.aspect=cw/ch;cam.updateProjectionMatrix();setup(v);renderer.render(scene,cam);});
}
loadBike().then(()=>{frame();document.title='ready';window.ready=true;});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);frame();});
window.frame=frame;
</script>
</body></html>
